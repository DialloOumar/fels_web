{% extends "base.html" %}

{% block title %}{{ t['pw.title'] }}{% endblock %}
{% block page_title %}{{ t['pw.title'] }}{% endblock %}

{% block content %}
<section class="card" style="max-width:460px;">
    {% if error %}<div class="alert alert--error" style="margin-bottom:14px;">{{ t[error] }}</div>{% endif %}
    {% if success %}<div class="alert alert--success" style="margin-bottom:14px;">{{ t[success] }}</div>{% endif %}

    <form method="post" class="entry-form">
        {{ csrf_field() }}
        <div class="field">
            <input type="password" id="current_password" name="current_password" placeholder=" " required autofocus autocomplete="current-password">
            <label for="current_password">{{ t['pw.current'] }}</label>
        </div>
        <div class="field">
            <input type="password" id="new_password" name="new_password" placeholder=" " required minlength="8" autocomplete="new-password">
            <label for="new_password">{{ t['pw.new'] }}</label>
        </div>
        <div class="field">
            <input type="password" id="confirm_password" name="confirm_password" placeholder=" " required minlength="8" autocomplete="new-password">
            <label for="confirm_password">{{ t['pw.confirm'] }}</label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn--primary">
                <span class="material-symbols-outlined">save</span> {{ t['pw.update'] }}
            </button>
        </div>
    </form>
</section>
{% endblock %}
