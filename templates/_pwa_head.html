{# Install metadata (home-screen icon, colours). Include inside <head>. #}
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fels">
<meta name="theme-color" content="#0E0E10">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
<link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='images/favicon.png') }}?v={{ v }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
