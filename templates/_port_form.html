{% from "_macros.html" import form_actions with context %}
{% if error %}<div class="alert alert--error" style="margin-bottom:12px;">{{ error }}</div>{% endif %}
<form method="post" class="entry-form" data-modal-form
      action="{{ url_for('settings.port_edit', pid=row.id) if row else url_for('settings.port_new') }}">
    {{ csrf_field() }}
    <div class="field">
        <input type="text" id="name" name="name" placeholder=" " required autofocus
               value="{{ request.form.get('name') or (row.name if row else '') }}">
        <label for="name">{{ t['port.name'] }}</label>
    </div>
    {{ form_actions(url_for('settings.index')) }}
</form>
