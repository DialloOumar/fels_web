services:

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: fels
      POSTGRES_USER: fels_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fels_user -d fels"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    env_file: .env
    expose:
      - "8000"                  # internal only; Caddy reaches it at web:8000
    ports:
      - "127.0.0.1:8002:8000"   # local debug on the host loopback (optional)
    volumes:
      - documents_data:/app/data/documents   # purchase documents, when no S3 bucket is set
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: always
    env_file: .env              # APP_DOMAIN is read by the Caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # persisted TLS certificates
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  documents_data:
  caddy_data:
  caddy_config:
